# Controls GitHub automatically generated release notes
# (used by `gh release create --generate-notes` in .github/workflows/release.yml).
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - dependencies
      - dependabot
    authors:
      # Login must include [bot] — bare "dependabot" does not match.
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Other Changes
      labels:
        - "*"
