name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          mkdir -p dist
          ldflags="-s -w -X github.com/MasterBOFH/GoBNC/internal/version.Version=${ver}"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              out="dist/gobnc_${ver}_${os}_${arch}"
              echo "building $out"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
                go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/gobnc
            done
          done
          (
            cd dist
            sha256sum gobnc_* | tee checksums.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/gobnc_* \
            dist/checksums.txt

      # Tag already points at this commit; bump version strings on main afterward.
      - name: Sync version on main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i "s/\"quit_message\": \"GoBNC [^\"]*\"/\"quit_message\": \"GoBNC ${ver}\"/" gobnc.json.example
          sed -i "s/var Version = \"[^\"]*\"/var Version = \"${ver}\"/" internal/version/version.go

          if git diff --quiet; then
            echo "main already at ${ver}"
            exit 0
          fi
          git add gobnc.json.example internal/version/version.go
          git commit -m "Bump version to ${ver}"
          git push origin main
