# ircd-irc2 config for GoBNC's `make test-ircd` interop matrix.
# Fields are |-separated; see doc/ircd.conf.example upstream.
#
# No connect-back checks: tests connect from the Docker host, so ircd
# sees the Docker bridge gateway as the client, and this host's
# firewall silently DROPs connect-backs to it. Every such check would
# wait out its full timeout, past the tests' 5s registration deadline.
# Ident and iauth's proxy/DNSBL scans are compiled out, and reverse
# DNS is patched out (no config switch exists) - see Dockerfile.

# Server name, info, UDP ping port, SID, split thresholds. The
# thresholds are mandatory but ignored: ircd runs with -p standalone.
M|ircd-irc2.test||GoBNC test ircd-irc2|4440|000A|10|5000|

A|GoBNC test matrix|nobody@ircd-irc2.test|test server||GoBNCTest|

# Plain-TCP client port.
P||||4440||

# Client class 1: ping 90s, 100 clients, 512k sendq. The last two
# fields are per-IP.per-user@IP limits, locally and net-wide; they
# default to 1.1, too few for the tests' parallel connections
# through the one gateway IP.
Y|1|90||100|512000|100.100|100.100|

# Anyone, no password. The host-name field must stay empty: with
# reverse DNS patched out, no client ever has a host name.
I|*@*||||1||
