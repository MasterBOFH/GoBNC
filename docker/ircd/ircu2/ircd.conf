# ircu2 config for GoBNC's `make test-ircd` interop matrix.
# Minimal on purpose: everything not set here is ircu's default.
#
# No connect-back checks: tests connect from the Docker host, so ircd
# sees the Docker bridge gateway as the client, and this host's
# firewall silently DROPs connect-backs to it. Every ident/DNS check
# would wait out its full timeout, past the tests' 5s registration
# deadline. Ident is off by never naming a username in a Client block
# (see below); reverse DNS is off via NODNS. ircu has no built-in
# proxy/DNSBL scanner and no iauth is configured.

General {
  name = "ircu2.test";
  description = "GoBNC test ircu2";
  numeric = 1;
};

Admin {
  Location = "GoBNC test matrix";
  Contact = "nobody@ircu2.test";
};

Class {
  name = "Local";
  pingfreq = 1 minutes 30 seconds;
  sendq = 160000;
  # 0 = no cap on clients in this class.
  maxlinks = 0;
};

# Any client, no password. IP mask only: a host mask would need DNS,
# and any username mask (even "*@...") turns on ident for everyone.
# maxlinks here is per IP; default 65535, so tests' parallel
# connections through the one gateway IP are fine.
Client {
  ip = "*";
  class = "Local";
};

Port {
  port = 4443;
};

features {
  "NODNS" = "TRUE";          # no reverse DNS lookup (see top)
  "AUTH_TIMEOUT" = "1";      # belt and braces: auth wait <= 1s
  # Reconnect throttle (default 4 per 40s per IP) would trip on the
  # test suite's many connects from the one gateway IP.
  "IPCHECK_CLONE_LIMIT" = "1000";
  # CLIENT_FLOOD (recvq) is deliberately left at its 1024 default:
  # TestIrcu2FloodRecvQ depends on it.
  "LOG" = "SYSTEM" "FILE" "ircd.log";
  "LOG" = "SYSTEM" "LEVEL" "CRIT";
};
