/*
 * ircd-hybrid 8.2.x config for GoBNC's `make test-ircd` interop matrix.
 * Minimal on purpose: anything not set here is the compiled-in default
 * (see doc/reference.ircd.conf in the ircd-hybrid source).
 *
 * Connect-back checks are all off (ident, reverse DNS, connect throttle).
 * The tests connect from the Docker host, so the ircd sees the Docker bridge
 * gateway as the client address; this host's firewall silently DROPs
 * connect-backs, so any such check waits out its full timeout -- past the
 * tests' 5s registration deadline.
 */

/* Standard module set, installed alongside this file by `make install`. */
.include "reference.modules.conf";

serverinfo {
	name = "hybrid.test";
	sid = "0HY";
	description = "GoBNC interop test server";
	network_name = "GoBNCTest";
	network_description = "GoBNC interop test network";
	hub = no;
};

admin {
	name = "GoBNC tests";
	description = "Test server administrator";
	email = "<nobody@hybrid.test>";
};

class {
	name = "users";
	ping_time = 90 seconds;
	/* Tests open 2-3 connections at once from the same (gateway) IP. */
	number_per_ip_local = 100;
	number_per_ip_global = 100;
	number_per_cidr = 100;
	cidr_bitlen_ipv4 = 32;
	cidr_bitlen_ipv6 = 128;
	max_number = 1000;
	sendq = 1 megabyte;
	recvq = 8 kilobytes;
};

listen {
	/* Plain-text client port only. */
	port = 4442;
};

auth {
	user = "*@*";
	class = "users";
	/* No flood limits, and ignore class/per-IP limits entirely. */
	flags = can_flood, exceed_limit;
};

general {
	/* No ident (connect-back) lookup -- see header. */
	disable_auth = yes;
	/* No reverse-DNS lookup of the client address -- see header. */
	disable_dns = yes;
	/*
	 * Default is 1 connection per IP per 1s; tests open several at once
	 * from one IP. throttle_time = 0 disables the throttle.
	 */
	throttle_count = 100;
	throttle_time = 0 seconds;
	/* Don't make clients echo a PONG cookie before registering. */
	ping_cookie = no;
	/* Don't hide clients by default (keep WHO/NAMES output unsurprising). */
	invisible_on_connect = no;
};
