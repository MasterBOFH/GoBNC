/*
 * ircd-ratbox 3.0.x config for GoBNC's `make test-ircd` interop matrix.
 * Minimal on purpose: anything not set here is the compiled-in default
 * (see doc/example.conf in the ircd-ratbox source).
 *
 * Connect-back checks are off (ident) and connection throttling is
 * neutralised. The tests connect from the Docker host, so the ircd sees the
 * Docker bridge gateway as the client address; this host's firewall
 * silently DROPs connect-backs, so any such check waits out its full
 * timeout -- past the tests' 5s registration deadline. (ratbox has no
 * switch for its reverse-DNS lookup of clients; the image patches that out
 * instead -- see no-reverse-dns.patch and the Dockerfile.)
 */

serverinfo {
	name = "ratbox.test";
	sid = "0RB";
	description = "GoBNC interop test server";
	network_name = "GoBNCTest";
	network_desc = "GoBNC interop test network";
	hub = no;
};

admin {
	name = "GoBNC tests";
	description = "Test server administrator";
	email = "<nobody@ratbox.test>";
};

class "users" {
	ping_time = 2 minutes;
	/* Tests open 2-3 connections at once from the same (gateway) IP. */
	number_per_ident = 100;
	number_per_ip = 100;
	number_per_ip_global = 100;
	number_per_cidr = 100;
	cidr_ipv4_bitlen = 32;
	cidr_ipv6_bitlen = 128;
	max_number = 1000;
	sendq = 1 megabyte;
};

listen {
	/* Plain-text client port only. */
	port = 4446;
};

auth {
	user = "*@*";
	class = "users";
	/* Ignore class/per-IP limits and flood limits entirely. */
	flags = exceed_limit, flood_exempt, spambot_exempt;
};

channel {
	/*
	 * A lone server counts as "split" (default thresholds: 10 servers /
	 * 15000 users) and then refuses to create channels (437 on JOIN).
	 */
	default_split_server_count = 0;
	default_split_user_count = 0;
	no_create_on_split = no;
	no_join_on_split = no;
};

general {
	/* No ident (connect-back) lookup -- see header. */
	disable_auth = yes;
	/*
	 * Default throttle is 4 connections per IP per 60s, which a test run
	 * from one (gateway) IP blows through; make it unreachable.
	 */
	throttle_count = 100000;
	throttle_duration = 1 second;
	/* Don't cache and auto-reject IPs of previously rejected clients. */
	reject_after_count = 0;
	/* Don't make clients echo a PONG cookie before registering. */
	ping_cookie = no;
	/* Max lines buffered from a client before Excess Flood (default 20). */
	client_flood = 2000;
	/*
	 * Don't rate-limit LIST/LUSERS/ADMIN/INFO etc. per server (defaults
	 * 10s / 1s between uses, answered with 263 even for flood_exempt).
	 */
	pace_wait = 0 seconds;
	pace_wait_simple = 0 seconds;
};
