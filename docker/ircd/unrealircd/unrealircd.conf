/*
 * Minimal UnrealIRCd 6 config for GoBNC's `make test-ircd` interop suite.
 * NOT a production config: everything that could reject, delay, or
 * flood-kill a burst of fresh plaintext test clients is relaxed or off.
 *
 * Why no connect-back checks (ident, DNSBL, reverse DNS): tests connect
 * from the Docker host, so the ircd sees the Docker bridge gateway as the
 * client, and this host's firewall silently DROPs connect-backs — each
 * check waits out its full timeout, past the tests' 5s registration
 * deadline.
 */

include "modules.default.conf";
include "operclass.default.conf";
include "snomasks.default.conf";
include "help/help.conf";

loadmodule "cloak_sha256";

/* DNSBL checks: a connect-back to external resolvers per client (and the
 * module bumps set::handshake-delay to 2s whenever blacklist blocks exist).
 * No blacklist blocks are configured; unload the module anyway. */
blacklist-module "blacklist";
/* Connection-rate throttling for "new" (low-reputation) users — every
 * test client is new. */
blacklist-module "connthrottle";

me {
	name "unrealircd.test";
	info "GoBNC interop test server";
	sid "001";
}

admin {
	"GoBNC test";
	"admin@unrealircd.test";
}

class clients {
	pingfreq 90;
	maxclients 1000;
	sendq 1M;
	recvq 8000;
}

allow {
	mask *;
	class clients;
	/* Default example is 3; tests open several clients from one IP
	 * (the Docker gateway), both at once and back to back. */
	maxperip 1000;
	global-maxperip 1000;
}

/* Plaintext client listener (UnrealIRCd 6 steers toward TLS by default). */
listen {
	ip *;
	port 4441;
}

/* UnrealIRCd 6 refuses to boot without at least one TLS listener. Not
 * published by the test matrix; uses the self-signed cert generated at
 * image build time (conf/tls/server.{cert,key}.pem, the defaults). */
listen {
	ip *;
	port 6697;
	options { tls; }
}

set {
	network-name "GoBNCTest";
	default-server "unrealircd.test";
	services-server "services.unrealircd.test";
	help-channel "#help";
	cloak-prefix "Clk";
	/* Random test-only keys (80 chars, mixed case + digits, as required). */
	cloak-keys {
		"IH0wa96SbSEq2eGU4VDSJdQQsmSLA18KKS3b68OAYfqiCl2TRLS1ZWWErqVZ9J9PetoLvWTuL09yT2Ei";
		"KGOojvhrklpOPuhClTUtlXHnTOLRFAoLh1FV70sYGHHeSJIMYtZYzKFuPWhAjdS5g9Bv8MXNbEnuxNl0";
		"VbC8TNReBO591WfxYlISeCf1dVLEBmEtiPZwFsy9qSRD1joFfjRiGylGwhujGp07QVhrEGUO9IwR9rfS";
	}
	kline-address "admin@unrealircd.test";

	options {
		/* No reverse DNS lookup of connecting clients (see header). */
		dont-resolve;
		/* identd-check is off by default in UnrealIRCd 6; left unset. */
	}

	/* Process client lines immediately (default only becomes 2s when
	 * blacklist blocks exist; pinned to 0 explicitly). */
	handshake-delay 0;
	/* Default 3: tests have 2–3 unregistered connections open at once. */
	max-unknown-connections-per-ip 1000;

	anti-flood {
		everyone {
			/* Default 3:60 — would refuse the 4th connection in a minute. */
			connect-flood 255:1; /* max allowed count/min period */
		}
		/* Fresh test clients fall in "unknown-users" (no reputation yet).
		 * Defaults there are 2 NICKs / 2 JOINs per 60–90s. */
		unknown-users {
			nick-flood 255:5;
			join-flood 255:5;
			away-flood 255:10;
			invite-flood 255:5;
			knock-flood 255:5;
			max-concurrent-conversations { users 20; new-user-every 1s; }
			/* No fake lag (default ~1s per command): the probe fires ~15
			 * commands back to back, then reads for only 4s. */
			lag-penalty 0;
			lag-penalty-bytes 512;
		}
		known-users {
			nick-flood 255:5;
			join-flood 255:5;
			away-flood 255:10;
			invite-flood 255:5;
			knock-flood 255:5;
			max-concurrent-conversations { users 20; new-user-every 1s; }
			/* No fake lag (default ~1s per command): the probe fires ~15
			 * commands back to back, then reads for only 4s. */
			lag-penalty 0;
			lag-penalty-bytes 512;
		}
		/* Default (6.2+) puts every new channel on +F "normal"; off so
		 * channels behave like a vanilla ircd. */
		channel {
			default-profile off;
		}
	}
}
