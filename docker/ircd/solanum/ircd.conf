/*
 * Minimal solanum config for GoBNC's `make test-ircd` interop suite.
 * Plain TCP on 4447, no passwords, no SASL, no services, no TLS.
 * Everything not set here is the compiled-in default; see
 * doc/reference.conf in the solanum source for the full list.
 */

serverinfo {
	name = "solanum.test";
	sid = "42X";
	description = "GoBNC interop test server";
	network_name = "GoBNCTest";
};

admin {
	name = "GoBNC test";
	description = "GoBNC interop test server";
	email = "nobody@solanum.test";
};

/*
 * Tests open 2-3 simultaneous connections, all from the same address
 * (the Docker bridge gateway), so lift the per-ip/ident/cidr caps.
 */
class "users" {
	ping_time = 2 minutes;
	number_per_ident = 1000;
	number_per_ip = 1000;
	number_per_ip_global = 1000;
	number_per_cidr = 1000;
	max_number = 1000;
	sendq = 400 kbytes;
};

listen {
	port = 4447;
};

auth {
	user = "*@*";
	class = "users";
};

channel {
	/* A lone unlinked server is otherwise permanently "split" (default
	 * thresholds are 10 servers / 15000 users), and split mode refuses
	 * to create channels -- so the first JOIN would fail instead of
	 * getting ops. */
	default_split_server_count = 0;
	default_split_user_count = 0;
	no_create_on_split = no;
};

general {
	/*
	 * No connect-back checks at all: tests connect from the Docker
	 * host, so the ircd sees the Docker bridge gateway as the client,
	 * and this host's firewall silently DROPs connect-backs -- each
	 * check waits out its full timeout, past the tests' 5s registration
	 * deadline. disable_auth turns off ident; there are deliberately no
	 * dnsbl {} or opm {} blocks. Reverse DNS has no config switch, so
	 * the Dockerfile patches authd not to do it at all.
	 */
	disable_auth = yes;

	/* The suite reconnects from one address many times a minute; the
	 * default (4 connections per 60s per IP) would reject it. */
	throttle_count = 1000;
	throttle_duration = 1;
};
