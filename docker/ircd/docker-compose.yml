# Major ircd matrix for parser interop (`make test-ircd`).
#
# Every server but Ergo is built here from a pinned upstream release (or,
# for Solanum and ratbox, which don't tag releases, a pinned commit) — see
# each directory's Dockerfile for the version. Bump a version by editing
# its Dockerfile's ARG; `make test-ircd` rebuilds as needed.
#
# All of them have ident, proxy and DNSBL checks off: tests connect from the
# Docker host, so the ircd sees the bridge gateway as the client, and a host
# firewall that drops connect-backs makes every such check wait out its
# full timeout, past the tests' registration deadlines.
services:
  ircd-irc2:
    build: ./ircd-irc2
    image: gobnc-test/ircd-irc2
    ports:
      - "127.0.0.1:4440:4440"
  unrealircd:
    build: ./unrealircd
    image: gobnc-test/unrealircd
    ports:
      - "127.0.0.1:4441:4441"
  hybrid:
    build: ./hybrid
    image: gobnc-test/hybrid
    ports:
      - "127.0.0.1:4442:4442"
  ircu2:
    build: ./ircu2
    image: gobnc-test/ircu2
    ports:
      - "127.0.0.1:4443:4443"
  bahamut:
    build: ./bahamut
    image: gobnc-test/bahamut
    ports:
      - "127.0.0.1:4444:4444"
  ratbox:
    build: ./ratbox
    image: gobnc-test/ratbox
    ports:
      - "127.0.0.1:4446:4446"
  solanum:
    build: ./solanum
    image: gobnc-test/solanum
    ports:
      - "127.0.0.1:4447:4447"
  inspircd:
    build: ./inspircd
    image: gobnc-test/inspircd
    ports:
      - "127.0.0.1:4448:6667"
  ergo:
    image: ghcr.io/ergochat/ergo:v2.19.1@sha256:ef885e44f7fa19101bbbc41baef11dc280dc8107465dccaf6f0860f41b48a682
    ports:
      - "127.0.0.1:6667:6667"
      - "127.0.0.1:6697:6697" # TLS — self-signed, see certs/ergo.{crt,key}
    volumes:
      - ./ergo.yaml:/ircd.yaml:ro
      - ./certs:/certs:ro
    command: ["ergo", "run", "--conf", "/ircd.yaml"]
