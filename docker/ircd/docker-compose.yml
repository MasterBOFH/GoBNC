# Major ircd matrix for parser interop (`make test-ircd`).
# Most irccom images are amd64-only; Colima/QEMU runs them via platform.
services:
  ircu2:
    image: irccom/ircu2:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4443:4443"
  unreal4:
    image: irccom/unreal4:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4441:4441"
  inspircd:
    image: irccom/inspircd:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4448:4448"
  hybrid:
    image: irccom/ircd-hybrid:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4442:4442"
    volumes:
      - ./hybrid/ircd.conf:/ircd-bin/etc/ircd.conf:ro
  ngircd:
    image: irccom/ngircd:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4445:4445"
  bahamut:
    image: irccom/bahamut:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      - ./bahamut/ircd.conf:/ircd-bin/ircd.conf:ro
  charybdis:
    image: irccom/charybdis:latest
    platform: linux/amd64
    # librb spins at 100% CPU in every process (ircd, authd, ssld, …) and
    # never answers a client when RLIMIT_NOFILE is as huge as Docker's
    # default here (1073741816) — cap it.
    ulimits:
      nofile: {soft: 4096, hard: 4096}
    ports:
      - "127.0.0.1:4447:4447"
    volumes:
      - ./charybdis/ircd.conf:/ircd-bin/etc/ircd.conf:ro
  ircd-irc2:
    image: irccom/ircd-irc2:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:4440:4440"
    volumes:
      - ./ircd-irc2/iauth.conf:/ircd-bin/etc/iauth.conf:ro
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    ports:
      - "127.0.0.1:6667:6667"
      - "127.0.0.1:6697:6697" # TLS — self-signed, see certs/ergo.{crt,key}
    volumes:
      - ./ergo.yaml:/ircd.yaml:ro
      - ./certs:/certs:ro
    command: ["ergo", "run", "--conf", "/ircd.yaml"]
