# Major ircd matrix for parser interop (`make test-ircd`).
#
# Images come from github.com/MasterBOFH/test-servers, each built there from
# a pinned upstream release and smoke-tested before it's published. Tags
# here are those upstream versions; bump one to move GoBNC's matrix to a
# newer release once test-servers publishes it.
#
# All of them have ident, proxy/DNSBL checks and reverse DNS off, and
# throttling off: tests connect from the Docker host, so every client
# looks like the bridge gateway (see test-servers' DEVELOPING.md).
services:
  ircd-irc2:
    image: ghcr.io/masterbofh/test-servers/ircd-irc2:2.11.3
    ports: ["127.0.0.1:4440:4440"]
  unrealircd:
    image: ghcr.io/masterbofh/test-servers/unrealircd-6:6.2.7
    ports: ["127.0.0.1:4441:4441"]
  hybrid:
    image: ghcr.io/masterbofh/test-servers/ircd-hybrid-8:8.2.47
    ports: ["127.0.0.1:4442:4442"]
  # Default 1024-byte CLIENT_FLOOD: TestIrcu2FloodRecvQ depends on it.
  ircu2:
    image: ghcr.io/masterbofh/test-servers/ircu2:u2.10.12.19
    ports: ["127.0.0.1:4443:4443"]
  bahamut:
    image: ghcr.io/masterbofh/test-servers/bahamut:2.2.4
    ports: ["127.0.0.1:4444:4444"]
  ngircd:
    image: ghcr.io/masterbofh/test-servers/ngircd:28
    ports: ["127.0.0.1:4445:4445"]
  ratbox:
    image: ghcr.io/masterbofh/test-servers/ircd-ratbox:3.0.10
    ports: ["127.0.0.1:4446:4446"]
  solanum:
    image: ghcr.io/masterbofh/test-servers/solanum:03503ff488ea5757a0fdfd62b7509b02b41904ab
    ports: ["127.0.0.1:4447:4447"]
  inspircd:
    image: ghcr.io/masterbofh/test-servers/inspircd-4:4.12.1
    ports: ["127.0.0.1:4448:4448"]
  ergo:
    image: ghcr.io/masterbofh/test-servers/ergo:2.19.1
    ports: ["127.0.0.1:4449:4449"]
