/*
 * Minimal bahamut 2.2.4 config for GoBNC's `make test-ircd` interop suite.
 * Plain TCP on 4444, no passwords, no services. Everything not set here
 * is the compiled-in default; see doc/reference.conf in the bahamut
 * source for the full list.
 */

global {
    name    bahamut.test;                 # IRC name of the server
    info    "GoBNC interop test server";  # Short info line
    admin {
        "GoBNC test";
        "GoBNC interop test server";
        "nobody@bahamut.test";
    };
};

options {
    network_name    GoBNCTest;  # A name is needed even if not linked
    allow_split_ops;            # Give ops in empty channels: otherwise a
                                # lone unlinked server never ops the first
                                # joiner (it treats itself as split)
};

/*
 * No connect-back checks at all: tests connect from the Docker host, so
 * the ircd sees the Docker bridge gateway as the client, and this host's
 * firewall silently DROPs connect-backs -- each check waits out its full
 * timeout, past the tests' 5s registration deadline. (This host's
 * resolver also never answers PTR queries for the bridge range.)
 */
port {
    port    4444;
    flags   ni;     # n: no reverse-DNS lookup, i: no ident check
};

class {
    name        users;
    pingfreq    90;         # PING idle connections every 90s
    maxsendq    100000;     # 100KB send buffer
    maxusers    1000;       # Maximum clients in this class
};

# Tests open 2-3 simultaneous connections, and reconnect often, all from
# one address (the Docker bridge gateway). Per-IP clone limits and the
# reconnect throttle are compiled out in the Dockerfile (the allow
# block's C/T flags can't stop the throttle, which fires at accept time).
allow {
    host    *@*;
    class   users;
};
